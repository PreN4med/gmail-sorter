<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gmail Sorter Rules</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 860px;
        margin: 24px auto;
        padding: 0 16px;
        color: #202124;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 4px;
      }
      .hint {
        color: #5f6368;
        font-size: 13px;
        margin-bottom: 18px;
      }
      .card {
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .row {
        display: grid;
        grid-template-columns: 24px 170px 1fr auto;
        gap: 8px;
        align-items: center;
      }
      input {
        padding: 7px 8px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
      }
      button {
        padding: 6px 10px;
        border: 1px solid #dadce0;
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #f1f3f4;
      }
      button.primary {
        background: #1a73e8;
        color: #fff;
        border-color: #1a73e8;
      }
      button.primary:hover {
        background: #1765cc;
      }
      .actions {
        white-space: nowrap;
      }
      .result {
        font-size: 12px;
        color: #5f6368;
        margin: 8px 0 0 32px;
      }
      .result li {
        margin: 2px 0;
      }
      #status {
        margin-left: 10px;
        font-size: 13px;
        color: #188038;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Gmail Sorter Rules</h1>
    <div class="hint">
      Rules run top to bottom and the first match wins. Each query uses Gmail
      search syntax, e.g. <code>from:(amazon.com) OR subject:receipt</code>. Use
      "Test" to see what a query matches in your inbox.
    </div>

    <div id="list">Loading...</div>

    <div class="toolbar">
      <button onclick="addRule()">+ Add rule</button>
      <button class="primary" onclick="save()">Save rules</button>
      <span id="status"></span>
    </div>

    <script>
      let rules = [];

      function el(tag, props, children) {
        const e = document.createElement(tag);
        Object.assign(e, props || {});
        (children || []).forEach((c) => e.appendChild(c));
        return e;
      }

      function render() {
        const list = document.getElementById("list");
        list.textContent = "";
        rules.forEach((r, i) => {
          const label = el("input", {
            value: r.label,
            placeholder: "Label, e.g. Sorted/School",
          });
          label.oninput = () => {
            rules[i].label = label.value;
          };
          const query = el("input", {
            value: r.query,
            placeholder: "Gmail search query",
          });
          query.oninput = () => {
            rules[i].query = query.value;
          };

          const result = el("div", { className: "result" });

          const up = el("button", { textContent: "↑", title: "Move up" });
          up.onclick = () => move(i, -1);
          const down = el("button", { textContent: "↓", title: "Move down" });
          down.onclick = () => move(i, 1);
          const test = el("button", { textContent: "Test" });
          test.onclick = () => preview(i, result);
          const del = el("button", { textContent: "✕", title: "Delete rule" });
          del.onclick = () => {
            rules.splice(i, 1);
            render();
          };

          const actions = el("div", { className: "actions" }, [
            up,
            down,
            test,
            del,
          ]);
          const row = el("div", { className: "row" }, [
            el("span", { textContent: i + 1 + "." }),
            label,
            query,
            actions,
          ]);
          list.appendChild(el("div", { className: "card" }, [row, result]));
        });
        if (rules.length === 0)
          list.textContent = 'No rules yet. Click "+ Add rule".';
      }

      function move(i, dir) {
        const j = i + dir;
        if (j < 0 || j >= rules.length) return;
        [rules[i], rules[j]] = [rules[j], rules[i]];
        render();
      }

      function addRule() {
        rules.push({ label: "", query: "" });
        render();
      }

      function preview(i, box) {
        const q = rules[i].query.trim();
        if (!q) {
          box.textContent = "Enter a query first.";
          return;
        }
        box.textContent = "Searching...";
        google.script.run
          .withSuccessHandler((subjects) => {
            box.textContent = "";
            if (!subjects.length) {
              box.textContent = "No matches in your inbox.";
              return;
            }
            box.appendChild(
              el("div", {
                textContent: "First " + subjects.length + " matches:",
              }),
            );
            const ul = el("ul");
            subjects.forEach((s) =>
              ul.appendChild(el("li", { textContent: s || "(no subject)" })),
            );
            box.appendChild(ul);
          })
          .withFailureHandler((err) => {
            box.textContent = "Error: " + err.message;
          })
          .previewRule(q);
      }

      function save() {
        const status = document.getElementById("status");
        status.style.color = "#5f6368";
        status.textContent = "Saving...";
        google.script.run
          .withSuccessHandler((clean) => {
            rules = clean;
            render();
            status.style.color = "#188038";
            status.textContent =
              "Saved. The next 5-minute run will use these rules.";
          })
          .withFailureHandler((err) => {
            status.style.color = "#d93025";
            status.textContent = "Error: " + err.message;
          })
          .saveRules(rules);
      }

      google.script.run
        .withSuccessHandler((r) => {
          rules = r;
          render();
        })
        .withFailureHandler((err) => {
          document.getElementById("list").textContent = "Error: " + err.message;
        })
        .getRules();
    </script>
  </body>
</html>
